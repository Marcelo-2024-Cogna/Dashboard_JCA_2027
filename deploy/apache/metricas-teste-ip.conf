# =====================================================================
#  Virtual hosts de TESTE por IP:PORTA (sem DNS) - Metricas Jeito Cogna Agil
#  Instalar em: /etc/apache2/sites-available/metricas-teste-ip.conf
#  Usar ENQUANTO o DNS de metricas.cogna.com.br nao existe. Quando o DNS
#  existir: a2dissite metricas-teste-ip, remover este arquivo e ativar o
#  vhost definitivo (metricas.cogna.com.br.conf). Passo a passo e bateria de
#  testes: deploy/LEIAME.md, secao 8c (item F).
#
#  Pre-requisitos: a2enmod ssl rewrite headers  (auth_basic, authn_file e
#  authz_user ja vem habilitados no Ubuntu). Arquivo de senhas:
#     sudo htpasswd -c /etc/apache2/.htpasswd_metricas <usuario>
#     sudo chown root:www-data /etc/apache2/.htpasswd_metricas
#     sudo chmod 640 /etc/apache2/.htpasswd_metricas
#  Ativar: a2ensite metricas-teste-ip ; apache2ctl configtest
#          systemctl restart apache2   (Listen novo exige restart na 1a vez)
#
#  DESENHO
#   - http://<ip>:8088/   USUARIOS: so telas de leitura. As rotas que gravam
#     ou disparam algo ficam BLOQUEADAS (403) neste HTTP sem senha.
#   - https://<ip>:8443/  ADMINISTRADOR: mesmas rotas bloqueadas pedem
#     Basic Auth (senha trafega cifrada). Certificado autoassinado.
#   - O 403 e dado ANTES do PHP: nada chega ao Jira nem ao banco.
#     (LocationMatch e mesclado depois de Directory; por isso o
#     "Require all denied" vence o "Require all granted" do Directory.)
#
#  ROTAS (confirmado em public/index.php, public/views e assets/js):
#   - Bloqueadas por completo: /painel (pagina que chama /settings*),
#     /baseline/*, /capacity/*, /settings*, /extracao/* (catalogo, agendar
#     e fila: so o modal "Extrair" as usa) e /metrics (usa o Jira).
#   - /extract: a leitura simples (GET sem query) devolve o cache e e usada
#     pelas telas /metricas/epicos e /metricas/sustentacao; por isso NAO e
#     bloqueada por inteiro. Qualquer metodo diferente de GET/HEAD, ou
#     qualquer query string (force, jql, sprints, mesmo codificados), chama o
#     Jira e regrava o cache: bloqueado no HTTP, com senha no HTTPS.
#   - Publicas: /, /metricas/*, /filtros, /graficos/*, /assets/*.
# =====================================================================

# O ports.conf do Ubuntu ja tem "Listen 80" e (em IfModule ssl) "Listen 443";
# estas linhas nao conflitam com eles.
Listen 8088
Listen 8443

<VirtualHost *:8088>
    ServerAdmin webmaster@localhost
    DocumentRoot /apps/metricas_jca/public

    <Directory /apps/metricas_jca/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/metricas_jca_ip_error.log
    CustomLog ${APACHE_LOG_DIR}/metricas_jca_ip_access.log combined

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "same-origin"
    </IfModule>

    # Rotas administrativas e de escrita: bloqueadas neste HTTP.
    <LocationMatch "^/(painel|baseline|capacity|settings|extracao|metrics)(/|$)">
        Require all denied
    </LocationMatch>
    # /extract: so a leitura simples do cache (GET/HEAD sem query string).
    <LocationMatch "^/extract(/|$)">
        <If "%{REQUEST_METHOD} !~ /^(GET|HEAD)$/ || %{QUERY_STRING} != ''">
            Require all denied
        </If>
    </LocationMatch>
</VirtualHost>

<VirtualHost *:8443>
    ServerAdmin webmaster@localhost
    DocumentRoot /apps/metricas_jca/public

    SSLEngine on
    # Certificado AUTOASSINADO padrao do Ubuntu: so para este teste (o navegador
    # avisa; o curl precisa de -k). O definitivo e o DigiCert do vhost final.
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    <Directory /apps/metricas_jca/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/metricas_jca_ip_error.log
    CustomLog ${APACHE_LOG_DIR}/metricas_jca_ip_access.log combined

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "same-origin"
    </IfModule>

    # Mesmas rotas do HTTP, agora com senha (Basic Auth). As telas publicas
    # (/, /metricas/*, /filtros, /graficos/*) seguem abertas.
    <LocationMatch "^/(painel|baseline|capacity|settings|extracao|metrics)(/|$)">
        AuthType Basic
        AuthName "Metricas JCA - Administracao"
        AuthUserFile /etc/apache2/.htpasswd_metricas
        Require valid-user
    </LocationMatch>
    <LocationMatch "^/extract(/|$)">
        <If "%{REQUEST_METHOD} !~ /^(GET|HEAD)$/ || %{QUERY_STRING} != ''">
            AuthType Basic
            AuthName "Metricas JCA - Administracao"
            AuthUserFile /etc/apache2/.htpasswd_metricas
            Require valid-user
        </If>
    </LocationMatch>
</VirtualHost>
